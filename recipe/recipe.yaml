context:
  version: "0.2.2"
  python_min: "3.11"

package:
  name: spaday-regular-layout
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/spaday-regular-layout/spaday_regular_layout-${{ version }}.tar.gz
  sha256: 4bec09c8f7852f733e80ae3fc43d26b0e0a744b6021a9c78691d3acc023deead

build:
  number: 0
  noarch: python
  script:
    env:
      SKIP_HATCH_JS: "1"
    content:
      - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
    - hatch-js
  run:
    - python >=${{ python_min }}
    - spaday >=0.6.0

tests:
  - python:
      imports:
        - spaday_regular_layout
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Serializable, resizable panel layouts for spaday
  homepage: https://github.com/1kbgz/spaday-regular-layout
  repository: https://github.com/1kbgz/spaday-regular-layout

extra:
  recipe-maintainers:
    - timkpaine
